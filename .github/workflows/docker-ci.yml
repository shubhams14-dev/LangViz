name: LangViz CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: docker build -t langviz-backend .

    - name: Test Python Execution inside Container
      run: |
        docker run --rm langviz-backend python -c "import matplotlib.pyplot as plt; plt.plot([1,2],[3,4]); plt.savefig('output/test_python.png')"

    - name: Test R Execution inside Container
      run: |
        docker run --rm langviz-backend Rscript -e "png('output/test_r.png'); plot(1:10, 1:10, type='b'); dev.off()"
